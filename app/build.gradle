plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jongin.bosstimer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jongin.bosstimer'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '5.0'
    }

    // 항상 같은 키로 서명해서, 다음 버전부터는 지우지 않고 바로 업데이트 설치 가능
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
